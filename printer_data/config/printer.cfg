[mcu]
serial: /dev/serial/by-id/usb-Klipper_same70q20b_00313853314B51353235303235303331-if00

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 4000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[adc_scaled vref_scaled]
vref_pin: PC0
vssa_pin: PC13

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0

[stepper_x]
#driver 0 port to b
step_pin = PC18
dir_pin = !PB5
enable_pin = !PA9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: EBBCan: PB6
position_min: 0
position_endstop: 250
position_max: 250
homing_speed: 25   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc5160 stepper_x]
cs_pin: PD17
spi_bus: usart1
chain_position:1
chain_length:6
interpolate: False
run_current: 0.8
sense_resistor: 0.05
diag0_pin: ^!PD29
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin = PC16
dir_pin = !PD10
enable_pin = !PA9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PD25 #io0
position_min: 0
position_endstop: 255
position_max: 255
homing_speed: 25  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PD17
chain_position:2
chain_length:6
interpolate: False
run_current: 0.8
sense_resistor: 0.05
diag0_pin: ^!PC17
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
#driver2 port to z0
step_pin: PC28
dir_pin: !PA4
enable_pin: !PA9
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 230
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc5160 stepper_z]
cs_pin: PD17
chain_position:3
chain_length:6
interpolate: False
run_current: 0.8
sense_resistor: 0.05
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
#driver3 to z1
step_pin: PC1
dir_pin: PA22
enable_pin: !PA9
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z1]
cs_pin: PD17
chain_position:4
chain_length:6
interpolate: False
run_current: 0.8
sense_resistor: 0.05
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
#driver4 to z2
step_pin: PC4
dir_pin: !PC3
enable_pin: !PA9
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z2]
cs_pin: PD17
chain_position:5
chain_length:6
interpolate: False
run_current: 0.8
sense_resistor: 0.05
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
#driver5 to z3
step_pin: PC9
dir_pin: PD14
enable_pin: !PA9
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc5160 stepper_z3]
cs_pin: PD17
chain_position:6
chain_length:6
interpolate: False
run_current: 0.8
sense_resistor: 0.05
stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA16
sensor_type: Generic 3950
pullup_resistor: 2200
sensor_pin: PC29
max_power: 0.6
min_temp: 0
max_temp: 120

#####################################################################
#   Fan Control
#####################################################################

[controller_fan controller_fan_right]
##  Controller fan - FAN2
kick_start_time: 0.5
heater: extruder
fan_speed: 1.0
pin: PA12

[controller_fan controller_fan_left]
##  Controller fan - FAN2
kick_start_time: 0.5
heater: extruder
fan_speed: 1.0
pin: PC8

[heater_fan exhaust_fan]
##  Exhaust fan - FAN3
pin: PA15
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: extruder
heater_temp: 60
fan_speed: 0.10

#####################################################################
#   LED Control
#####################################################################

## Chamber Lighting - HE2 Connector (Optional)
[neopixel caselight]
pin: PD16
chain_count: 36
color_order: GRB

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
home_xy_position:125,125
speed:200
z_hop:10

[quad_gantry_level]
gantry_corners:
   -60,-10
   310, 320
#  Probe points
points:
   15,5
   15,200
   235,200
   235,5


#--------------------------------------------------------------------
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

######################
# Bed Settings #
######################

[bed_mesh]
speed: 300                           # Kann mit Cartographer sehr hoch sein
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 220, 220                   # Bei 250mm Bett, minus Rand
probe_count: 15,15
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.2
adaptive_margin: 5
zero_reference_position: 125, 125

########################################
# ebb36
########################################

[mcu EBBCan]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: a9bac24414ca

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
gear_ratio: 9:1
rotation_distance: 47.766
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: ATC Semitec 104GT-2
sensor_pin: EBBCan: PA3
min_temp: 0
max_temp: 260
pressure_advance: 0.035
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 101
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.6
stealthchop_threshold: 0

[fan]
pin: EBBCan: PA0

[heater_fan hotend_fan]
pin: EBBCan: PA1
heater: extruder
heater_temp: 50.0

#####################################################################
#   Filament Sensoren mit Auto-Reload Logik
#   PB9: VOR Extruder (Zulauf-Überwachung)
#   PB8: NACH Extruder (Runout-Erkennung)
#####################################################################

# Sensor: NACH dem Extruder (Hauptsensor - erkennt echten Runout)
[filament_switch_sensor sensor_nach_extruder]
switch_pin: ^EBBCan:PB8
pause_on_runout: False     # Manuelles Handling via Macro
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    RESPOND MSG="Filament-Ende erkannt - starte Auto-Reload"
    M117 Filament leer - Reload
    FILAMENT_RUNOUT_HANDLER
insert_gcode:
    RESPOND MSG="Filament nach Extruder: OK"
    M117 Filament nachgeladen

# Sensor: VOR dem Extruder (Reload-Confirmation & Zulauf-Check)
[filament_switch_sensor sensor_vor_extruder]
switch_pin: ^EBBCan:PB9
pause_on_runout: False     # Nur Warnung, kein Auto-Pause
event_delay: 1.0
runout_gcode:
    RESPOND MSG="Warnung: Kein Filament im Zulauf"
    M117 Zulauf unterbrochen
insert_gcode:
    RESPOND MSG="Filament-Zulauf: OK"

#####################################################################
#   Auto-Reload Logik
#####################################################################

[gcode_macro FILAMENT_RUNOUT_HANDLER]
description: Behandelt Filament-Runout mit Auto-Reload Versuch
gcode:
    {% set max_extrude = 150 %}          # Max. Extrusionslänge für Reload
    {% set extrude_speed = 300 %}        # Reload-Geschwindigkeit (mm/min)
    {% set retract_on_pause = 5 %}       # Retract wenn Reload fehlschlägt
    
    SAVE_GCODE_STATE NAME=FILAMENT_RUNOUT
    
    M117 Filament-Ende - versuche Reload
    RESPOND MSG="=== FILAMENT RUNOUT DETECTED ==="
    
    # Position sichern und etwas Z anheben (nur wenn gehomed)
    {% if printer.toolhead.homed_axes == "xyz" %}
        G91  # Relative Positionierung
        G1 Z5 F3000  # 5mm hoch für Sicherheit
        G90
    {% endif %}
    
    # Prüfe ob vorderer Sensor (PB9) noch Filament sieht
    {% if printer['filament_switch_sensor sensor_vor_extruder'].filament_detected %}
        RESPOND MSG="Vorderer Sensor hat Filament - starte Auto-Reload"
        M117 Auto-Reload läuft...
        
        # Extruder auf Temperatur halten
        {% set target_temp = printer.extruder.target %}
        {% if target_temp < 180 %}
            RESPOND MSG="Heize Extruder für Reload"
            M109 S200  # Mindesttemperatur für Extrusion
        {% endif %}
        
        # Versuche Filament durchzuziehen
        M83  # Relative Extrusion
        G1 E{max_extrude} F{extrude_speed}
        G4 P1000  # 1 Sekunde warten
        
        # Prüfe ob unterer Sensor (PB8) jetzt Filament hat
        {% if printer['filament_switch_sensor sensor_nach_extruder'].filament_detected %}
            RESPOND MSG="SUCCESS: Auto-Reload erfolgreich!"
            M117 Reload erfolgreich - setze fort
            G1 E10 F300  # Kleine Purge
            M82  # Absolute Extrusion
            RESTORE_GCODE_STATE NAME=FILAMENT_RUNOUT
            RESPOND MSG="Druck wird in 3 Sekunden fortgesetzt..."
            G4 P3000
            RESUME
        {% else %}
            RESPOND MSG="FAIL: Auto-Reload fehlgeschlagen - manuelle Pause"
            M117 Reload fehlgeschlagen - Eingriff nötig
            G1 E-{retract_on_pause} F1800  # Retract
            M82
            PAUSE
        {% endif %}
    {% else %}
        RESPOND MSG="KEIN FILAMENT: Vorderer Sensor leer - Spule wechseln!"
        M117 Spule leer - bitte wechseln
        G1 E-{retract_on_pause} F1800  # Retract
        M82
        PAUSE
    {% endif %}

#####################################################################
#   Manueller Filament-Reload (für RESUME nach Wechsel)
#####################################################################

[gcode_macro FILAMENT_RELOAD]
description: Manueller Reload-Versuch nach Spulenwechsel
gcode:
    {% set extrude_length = params.LENGTH|default(100)|float %}
    {% set extrude_speed = params.SPEED|default(300)|int %}
    
    {% if printer.extruder.temperature < 180 %}
        RESPOND MSG="ERROR: Extruder zu kalt für Reload"
        M117 Heize erst auf Drucktemperatur
        M109 S200
    {% endif %}
    
    M117 Lade Filament...
    RESPOND MSG="Extrudiere {extrude_length}mm mit {extrude_speed}mm/min"
    M83
    G1 E{extrude_length} F{extrude_speed}
    
    # Prüfe Sensoren
    {% if printer['filament_switch_sensor sensor_nach_extruder'].filament_detected %}
        RESPOND MSG="SUCCESS: Filament erfolgreich geladen!"
        M117 Filament OK - bereit für RESUME
        G1 E5 F300  # Kleine Purge
    {% else %}
        RESPOND MSG="Warnung: Unterer Sensor sieht noch kein Filament"
        M117 Lade mehr nach oder prüfe Sensor
    {% endif %}
    M82

#####################################################################
#   Sensor Status Check
#####################################################################

[gcode_macro CHECK_FILAMENT_SENSORS]
description: Zeigt aktuellen Status beider Sensoren
gcode:
    {% set sensor_vor = printer['filament_switch_sensor sensor_vor_extruder'].filament_detected %}
    {% set sensor_nach = printer['filament_switch_sensor sensor_nach_extruder'].filament_detected %}
    
    RESPOND MSG="=== FILAMENT SENSOR STATUS ==="
    RESPOND MSG="Sensor VOR Extruder (PB9): {'FILAMENT OK' if sensor_vor else 'KEIN FILAMENT'}"
    RESPOND MSG="Sensor NACH Extruder (PB8): {'FILAMENT OK' if sensor_nach else 'KEIN FILAMENT'}"
    
    {% if sensor_vor and sensor_nach %}
        M117 Beide Sensoren: OK
    {% elif not sensor_vor and not sensor_nach %}
        M117 Beide Sensoren: LEER
    {% else %}
        M117 Sensor-Status: PRÜFEN
    {% endif %}

#####################################################################
#   Auto-Aktivierung beim Start
#####################################################################

[delayed_gcode ENABLE_FILAMENT_SENSORS]
initial_duration: 2.0
gcode:
    SET_FILAMENT_SENSOR SENSOR=sensor_vor_extruder ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=sensor_nach_extruder ENABLE=1
    RESPOND MSG="Intelligente Filament-Sensoren aktiviert (PB8/PB9)"

########################################
# Cartographer
########################################

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
canbus_uuid: f4afbe93a859

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 23 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: yes # For extra output

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

#####################################################################
#  Input Shaper (via Cartographer)
#####################################################################

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    125, 125, 20  # In der Mitte deines 250mm Betts, 20mm hoch
    
########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,#####################################################################
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

#####################################################################
#   Macros
#####################################################################

[gcode_macro G32]
gcode:
    # Prüfen ob bereits gehomed, sonst vollständiges Homing
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    QUAD_GANTRY_LEVEL
    G28 Z  # Nur Z erneut homen nach QGL für höhere Genauigkeit

[gcode_macro PRINT_START]
gcode:
    # Parameter aus Slicer holen und validieren
    {% if params.BED is not defined or params.EXTRUDER is not defined %}
        {action_raise_error("FEHLER: BED und EXTRUDER Parameter sind erforderlich!")}
    {% endif %}
    
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    {% set preheat_temp = 170 %}  # Vorwärmtemperatur für Nozzle
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

    # 1. Homing und QGL (G32 macht beides)
    STATUS_HOMING
    G32
    G90  # Absolute Positionierung

    # 2. Bett heizen, Nozzle vorwärmen
    BED_MESH_CLEAR
    STATUS_HEATING
    M104 S{preheat_temp}  # Nozzle auf 170°C vorwärmen (verhindert Oozing)
    M190 S{target_bed}    # Warten auf Bett-Temperatur
    
    # Heat-Soak für hohe Bett-Temperaturen (>79°C)
    {% if params.BED|int > 79 %}
        SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
        STATUS_HEATING
        M106 S255  # Part-Cooling-Fan für Luftzirkulation

        ##  Uncomment if you have a Nevermore
        #SET_PIN PIN=nevermore VALUE=1

        G1 X{x_wait} Y{y_wait} Z15 F9000
        M190 S{target_bed}
        SET_DISPLAY_TEXT MSG="Soak for 5min"
        G4 P300000  # 5min Heat-Soak
    {% else %}
        SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
        STATUS_HEATING
        G1 X{x_wait} Y{y_wait} Z15 F9000
        M190 S{target_bed}
        # Kein Soak für PLA/niedrige Temps
    {% endif %}

    # 3. Nozzle-Reinigung bei Vorwärmtemperatur
    SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
    M109 S{preheat_temp}  # Sicherstellen dass Temperatur erreicht ist
    NOZZLE_WIPE

    # 4. Cartographer Touch für exakten Z-Nullpunkt
    SET_DISPLAY_TEXT MSG="Calibrating Z"
    STATUS_CALIBRATING_Z
    SET_GCODE_OFFSET Z=0  # Offset zurücksetzen vor Touch
    CARTOGRAPHER_TOUCH_HOME

    # 5. Adaptive Bed Mesh
    SET_DISPLAY_TEXT MSG="Bed mesh"
    STATUS_MESHING
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 6. Auf Druck-Temperatur heizen
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
    STATUS_HEATING
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M107  # Part-Cooling-Fan aus
    M109 S{target_extruder}  # Warten auf Extruder-Temperatur
    
    # 7. Purge und Start
    G11  # Firmware Un-Retract
    PURGE_BLOB
    STATUS_PRINTING
    SET_DISPLAY_TEXT MSG="Printing..."

[gcode_macro PRINT_END]
gcode:
    # Safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400  # Warten bis alle Moves abgeschlossen sind
    G92 E0  # Extruder nullen
    G10  # Firmware Retract
    
    TURN_OFF_HEATERS
    
    G90  # Absolute Positionierung
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  # Anti-stringing move
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  # Park mittig hinten
    M400  # Warten bis Parking abgeschlossen
    M107  # Part-Cooling-Fan aus
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    STATUS_PART_READY
    SET_DISPLAY_TEXT MSG="Print complete!"

[gcode_macro PURGE_BLOB]
description: Optimierter Purge Blob mit korrekter Retraction
gcode:
    # Einstellungen
    {% set x = 10 %}
    {% set y = 10 %}
    {% set z = 0.4 %}
    {% set purge_amount = 8 %}
    {% set retract = 0.5 %}
    {% set flow_rate = 600 %}  # Erhöht von 300 auf 600 für schnelleren Purge

    # Sicherheits-Check
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=PURGE_BLOB_STATE
    
    G90  # Absolute Positionierung für Moves
    M83  # RELATIVE Extrusion (wichtig für G10/G11)
    G92 E0  # Extruder nullen

    # Anfahren
    G1 Z5 F3000
    G1 X{x} Y{y} F9000
    G1 Z{z} F1200

    # Blob extrudieren
    G1 E{purge_amount} F{flow_rate}
    G4 P500  # Kurz warten für Druckausgleich

    # Retract & Wipe
    G1 E-{retract} F1800
    G1 X{x+5} F9000  # Wisch nach rechts
    G1 Z5 F3000  # Z anheben
    G1 X{x+20} F9000  # Wegfahren

    # Aufräumen
    G92 E0
    RESTORE_GCODE_STATE NAME=PURGE_BLOB_STATE
    M82  # Zurück zu ABSOLUTER Extrusion für Slicer

[firmware_retraction]
retract_length: 0.5
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
#retract_speed: 20
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
#unretract_speed: 10
#   The speed of unretraction, in mm/s. The default is 10 mm/s.

