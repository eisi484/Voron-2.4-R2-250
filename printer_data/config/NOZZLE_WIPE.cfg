[gcode_macro NOZZLE_WIPE]
description: Optimiertes V-Form Wisch-Makro für Duet3 6HC (250mm)
gcode:
    # ----- KONFIGURATION (Duet3 6HC - 250mm) -----
    {% set brush_x = 201 %}       # Start X (Links)
    {% set wipe_dist = 36 %}      # Gesamte Wischlänge in X
    
    # Y-Bereich (V-Form geht von 255 runter auf 250 und zurück)
    {% set brush_y_min = 250 %}   # Vorne (Spitze des V)
    {% set brush_y_max = 255 %}   # Hinten (Start/Ende des V)

    {% set brush_z = 1.0 %}       # Eintauch-Höhe
    {% set wipe_qty = 5 %}        # Anzahl der kompletten Durchgänge
    {% set wipe_spd = 5000 %}     # Geschwindigkeit (mm/min)
    {% set travel_spd = 6000 %}   # Anfahrgeschwindigkeit
    {% set z_clearance = 5 %}     # Sicherheitsabstand über Bürste
    # -------------------------------------

    # Sicherheitscheck
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_respond_info("NOZZLE_WIPE: Drucker nicht gehomed - starte Homing")}
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=NOZZLE_WIPE
    G90  # Absolute Positionierung

    # 1. Anfahrt zur Startposition (LINKS HINTEN - Start des V)
    G1 Z{brush_z + z_clearance} F3000
    G1 X{brush_x} Y{brush_y_max} F{travel_spd}

    # 2. Eintauchen in die Bürste
    G1 Z{brush_z} F3000

    # 3. V-Form Wischen (5× hin und zurück)
    {% for i in range(wipe_qty) %}
        # --- HINWEG (Zeichnet ein V) ---
        # Teil 1: Zur Mitte und nach VORNE (Spitze des V)
        G1 X{brush_x + (wipe_dist / 2)} Y{brush_y_min} F{wipe_spd}
        
        # Teil 2: Zum Ende und nach HINTEN
        G1 X{brush_x + wipe_dist} Y{brush_y_max} F{wipe_spd}
        
        # --- RÜCKWEG (Zeichnet das V rückwärts) ---
        # Teil 1: Zur Mitte und nach VORNE
        G1 X{brush_x + (wipe_dist / 2)} Y{brush_y_min} F{wipe_spd}
        
        # Teil 2: Zum Start und nach HINTEN
        G1 X{brush_x} Y{brush_y_max} F{wipe_spd}
    {% endfor %}

    # 4. Sicher wegfahren
    G1 Z{brush_z + z_clearance} F3000
    G1 X{brush_x + (wipe_dist / 2)} Y{brush_y_min - 10} F{travel_spd}  # Weg von der Bürste
    
    RESTORE_GCODE_STATE NAME=NOZZLE_WIPE
    {action_respond_info("NOZZLE_WIPE: Fertig")}
